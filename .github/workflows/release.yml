name: Package and Release

on:
  push:
    paths:
      - "exe.p2.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble exe from parts
        id: asm
        run: |
          if ! ls exe.p2.* >/dev/null 2>&1; then echo "no parts yet"; exit 0; fi
          : > FormatMaskTool.exe
          for f in exe.p2.*; do base64 -d "$f" >> FormatMaskTool.exe; done
          SIZE=$(stat -c%s "FormatMaskTool.exe")
          echo "size=$SIZE / expect=38368523"
          if [ "$SIZE" -ne 38368523 ]; then echo "partial, skip"; exit 0; fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Create Release and upload exe
        if: steps.asm.outputs.ready == 'true' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3
          name: "v1.3 格式转换与打码工具"
          body: "Windows 独立版（免安装，约 37MB）。下载 FormatMaskTool.exe 双击运行即可。v1.3：进一步修复白屏——禁用 GPU 加速渲染、独立用户数据目录；页面 20 秒加载不出来会提示改用默认浏览器打开（功能一致）；故障日志在 %TEMP%\\FormatMaskTool.log。"
          files: "FormatMaskTool.exe"

      - name: Remove part files
        if: steps.asm.outputs.ready == 'true' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -qf exe.p2.* 2>/dev/null || true
          git rm -qf exe.part.09 2>/dev/null || true
          git commit -qm "chore: remove exe part files after release" || true
          git push
